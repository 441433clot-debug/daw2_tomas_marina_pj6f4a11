<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Create Order</title>

    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>
    <main class="container">
        <h1>Create New Order</h1>
        <!--Formulari-->
        <form id="orderForm">
            <label for="orderId">Order ID</label>
            <input type="text" id="orderId" name="orderId">
            <label for="customerName">Customer Full Name</label>
            <input type="text" id="customerName" name="customerName">
            <label for="customerAddress">Customer Address</label>
            <input type="text" id="customerAddress" name="customerAddress">
            <label for="customerEmail">Customer Email</label>
            <input type="email" id="customerEmail" name="customerEmail">
            <label for="customerPhone">Customer Phone</label>
            <input type="tel" id="customerPhone" name="customerPhone">
            <br>
            
            <h2>Products</h2>
            <div class="product">
            <!--Primer producte-->
            <input type="checkbox" id="nike" name="products[]" value="Nike Air Max 270">
            <label for="nike"> Nike Air Max 270 (€120)</label>
            <input type="number" id="nikeQuantity" name="nikeQuantity" min="1" value="1">
            </div>
            <br>

            <!--Segon Producte-->
            <div class="product">
            <input type="checkbox" id="adidas" name="products[]" value="Adidas Samba">
            <label for="adidas">Adidas Samba (€95)</label>
            <input type="number" id="adidasQuantity" name="adidasQuantity" min="1" value="1">
            </div>
            <br>

            <!--Tercer Producte-->
            <div class="product">
            <input type="checkbox" id="converse" name="products[]" value="Converse Chuck Taylor">
            <label for="converse">Converse Chuck Taylor (€70)</label>
            <input type="number" id="converseQuantity" name="converseQuantity" min="1" value="1">
            </div>
            <br>

            <!--Quart Producte-->
            <div class="product">
            <input type="checkbox" id="newbalance" name="products[]" value="New Balance 530">
            <label for="newbalance">New Balance 530 (€110)</label>
            <input type="number" id="newBalanceQuantity" name="newBalanceQuantity" min="1"value="1">
            </div>
            <br><br>

            <button type="submit">Create Order</button>
            <p id="orderMessage"></p>
            </form>
        
            <div class="buttons">
            <button type="button"
                id="menuButton">
                Operation Menu
            </button>
            <button type="button" id="homeButton">Home</button>
        </div>
    </main>
    <script src="../js/main.js"></script>
</body>
</html>
