<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="container">
        <h1>Application Documentation</h1>
        <h2>Description</h2>

        <p>
            This application allows employees of the shoe store to create
            customer orders and consult saved orders.
        </p>

        <h2>Available Operations</h2>
        
        <ul>
            <li>Create a new customer order.</li>
            <li>Display all stored orders.</li>
            <li>Search for an order by its identifier.</li>
        </ul>
        
        <div class="buttons">
            <button id="homeButton">
                Home
            </button>
            <button id="loginButton">
                Login
            </button>
        </div>
    </main>
    <script src="../js/main.js"></script>
</body>
</html>
