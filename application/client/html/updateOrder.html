<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Update Order</title>
    <link rel="stylesheet"
          href="../css/style.css">
</head>

<body>
    <main class="container">
        <h1>Update Order</h1>

        <form id="updateForm">
            <label for="orderId">
                Order ID
            </label>

            <br><br>

            <input
                type="text"
                id="orderId"
                name="orderId">

            <br><br>

            <div class="buttons">
                <button
                    type="button"
                    id="menuButton">
                    Menu
                </button>

                <button
                    type="submit">
                    Search
                </button>
            </div>
        </form>
        <p id="updateMessage"></p>
    </main>
    <script src="../js/navigation.js"></script>
    <script src="../js/updateOrder.js"></script>
</body>
</html>
