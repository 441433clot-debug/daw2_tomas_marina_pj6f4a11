<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Menu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="container">
        <h1>Operation Menu</h1>

        <label for="operation">
            Select an operation
        </label>

        <br><br>

        <select id="operation">
            <option value="createOrder.html">
                Create New Order
            </option>
            <option value="viewOrders.html">
                View Orders
            </option>
        </select>

        <br><br>

        <div class="buttons">
            <button id="continueButton">
                Continue
            </button>

            <button id="homeButton">
                Home
            </button>
        </div>
    </main>
    <script src="../js/main.js"></script>
</body>
</html>
